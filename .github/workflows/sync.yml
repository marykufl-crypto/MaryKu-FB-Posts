name: Sync Content

on:
  schedule:
    # 預設：每週一 11:30 香港時間（UTC 03:30）。想改時間就編輯這一行的 cron。
    - cron: "30 3 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync Facebook pages
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIN_ENGAGE: ${{ vars.MIN_ENGAGE }}
          OUTLIER_X: ${{ vars.OUTLIER_X }}
          MIN_SHARES: ${{ vars.MIN_SHARES }}
          MIN_ER: ${{ vars.MIN_ER }}
          TOP_N_PER_COMP: ${{ vars.TOP_N_PER_COMP }}
          MAX_PER_COMP: ${{ vars.MAX_PER_COMP }}
          DAYS_BACK: ${{ vars.DAYS_BACK }}
          RESULTS_LIMIT: ${{ vars.RESULTS_LIMIT }}
        run: python -u sync_content.py
